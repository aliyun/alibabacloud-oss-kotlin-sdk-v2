name: CI (Publish)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal

      - name: Verify target parity between modules
        run: |
          BASE=~/.m2/repository/com/aliyun
          core=$(find "$BASE" -maxdepth 1 -type d -name 'kotlin-oss-v2-*' -printf '%f\n' | sed 's#^kotlin-oss-v2-##' | grep -v '^extension' | sort)
          ext=$(find "$BASE" -maxdepth 1 -type d -name 'kotlin-oss-v2-extension-*' -printf '%f\n' | sed 's#^kotlin-oss-v2-extension-##' | sort)
          if [ -z "$core" ] || [ -z "$ext" ]; then
            echo "::error::no published modules found under $BASE (publish step may have produced nothing)"
            exit 1
          fi
          echo "oss-sdk targets:"; echo "$core"
          echo "oss-sdk-extension targets:"; echo "$ext"
          if [ "$core" != "$ext" ]; then
            echo "::error::oss-sdk and oss-sdk-extension published target sets differ"
            diff <(echo "$core") <(echo "$ext") || true
            exit 1
          fi
          echo "Target sets match."
