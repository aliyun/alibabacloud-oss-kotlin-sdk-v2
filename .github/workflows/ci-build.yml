name: CI (Build)

on:
  push:
    branches:
      - main
      - 'dev-*'
  pull_request:
    branches:
      - main
      - 'dev-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every platform even if one fails, so a single red target never hides the others.
      fail-fast: false
      matrix:
        include:
          - name: JVM
            os: ubuntu-latest
            tasks: ":oss-sdk:jvmTest :oss-sdk-extension:jvmTest"
          - name: Android
            os: ubuntu-latest
            tasks: ":oss-sdk:testDebugUnitTest :oss-sdk-extension:testDebugUnitTest"
          - name: JS
            os: ubuntu-latest
            tasks: ":oss-sdk:jsTest :oss-sdk-extension:jsTest"
          - name: WasmJs
            os: ubuntu-latest
            tasks: ":oss-sdk:wasmJsTest"
          - name: macOS
            os: macos-latest
            tasks: ":oss-sdk:macosArm64Test :oss-sdk-extension:macosArm64Test"
          - name: iOS
            os: macos-latest
            tasks: ":oss-sdk:iosSimulatorArm64Test :oss-sdk-extension:iosSimulatorArm64Test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew ${{ matrix.tasks }}
